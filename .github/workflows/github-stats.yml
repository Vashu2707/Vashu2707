name: Update GitHub Profile Stats

on:
schedule:
- cron: "17 3 * * *"
workflow_dispatch:

permissions:
contents: write

concurrency:
group: github-profile-stats
cancel-in-progress: false

jobs:
stats:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout profile repository
    uses: actions/checkout@v4

  - name: Generate GitHub Stats
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: stats
      options: username=Vashu2707&show_icons=true&theme=radical&title_color=00F0FF&icon_color=FF00FF&hide_border=true
      path: profile/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate Top Languages
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: top-langs
      options: username=Vashu2707&layout=compact&langs_count=8&theme=radical&title_color=00F0FF&hide_border=true
      path: profile/top-langs.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Commit updated stats
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add profile/stats.svg profile/top-langs.svg

      if git diff --cached --quiet; then
        echo "No changes to commit."
      else
        git commit -m "chore: update GitHub profile stats"
        git push
      fi
```
